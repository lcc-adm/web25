<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>grid demo</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 300px 1fr 300px;
            gap: 0px 0px;
            grid-auto-flow: row;
            grid-template-areas:
                "header header header"
                "sideleft main sideright"
                "footer footer footer";
        }

        .header {
            grid-area: header;
            background: pink;
        }

        .sideleft {
            grid-area: sideleft;
            background-color: yellow;
        }

        .main {
            grid-area: main;
        }

        .sideright {
            grid-area: sideright;
        }

        .footer {
            grid-area: footer;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header"></div>
        <div class="sideleft">
            <h2>sidebar</h2>
        </div>
        <div class="main">
            <h2>this is the main content area</h2>
        </div>
        <div class="sideright">
            <h2>right side over here</h2>
        </div>
        <div class="footer">
            <h2>footer</h2>
        </div>
    </div>
</body>

</html>
