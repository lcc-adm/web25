<!doctype html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <title>class id demo</title>
    <style>
        body {
            background-image: linear-gradient( 135deg, #52E5E7 10%, #0c6db7 100%);
            background-size: cover;
            background-attachment: fixed;
            color: #fff;
        }

        h1 {
            background-image: linear-gradient( 135deg, #90b12b 10%, #0c6db7 100%);
        }

        p {
            color: orange;
        }

        .bob {
            color: yellow;
            background: #888;
        }

        #tom {
            color: green;
        }
    </style>
</head>

<body>
    <h1>this is color studies stuff</h1>
    <p>egae ae ae ae err er ger </p>

    <p class="bob">srertgergter sefwef we <span id="tom">hbjhbjw fwf</span> we fewe</p>
    
    <p>tgergeberge</p>
    <p>etetegerge gerg</p>
</body>

</html>
