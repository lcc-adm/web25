<!doctype html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <title>links page</title>
    <style>
        a {
            color: #b7097d;
            text-decoration: none;
            display: block;
            width: 150px;
            height: 30px;
            border-radius: 20px;
            background: pink;
            border: 2px solid red;
            padding: 10px;
            text-align: center;
            box-shadow: 5px 5px #b7097d;
        }

        a:hover {
            color: green;
            font-weight: 900;
            border: 2px solid transparent;
            box-shadow: 5px 5px 0px #0000;
        }

        a:active {
            background: #000;
        }

        .two {
            background: orange;
            border: none; 
            border-radius: 0;
        }

        .two:hover {
box-shadow: inset 3px 3px 20px #b7097d;
        }
.three {
    background: #ccc;
    color: black;
    width: 200px;
    border-radius: 0;
    border: 3px solid black;
    border-left: none;
    border-right: none;
    box-shadow: 0px 0px transparent;
}

.three:hover {
    color: #333;
    border: 3px solid #aaa;
    border-left: none;
    border-right: none;
}
    </style>
</head>

<body>
    <p><a href="#">link text</a></p>
    <p><a class="two" href="#">link text</a></p>
    <p><a class="three" href="#">link text</a></p>
</body>

</html>
